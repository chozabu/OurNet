name: ournet
description: Friend-to-friend sharing with persistent identities and signed provenance.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ournet_core:
    path: ../core
  ournet_transport:
    path: ../transport
  iroh_flutter:
    path: ../vendor/iroh_mobile
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  flutter_secure_storage: 10.0.0
  flutter_webrtc: ^1.6.2+hotfix.1
  iroh_quic: 1.0.3
  flutter_rust_bridge: 2.12.0
  flutter_local_notifications: 22.0.1
  pasteboard: 0.3.0
  app_badge_plus: 1.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  desktop_drop: ^0.8.4
  animations: 2.1.2
  flutter_staggered_grid_view: 0.7.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: 4.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/maps/world_land.geojson
