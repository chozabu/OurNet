name: ournet
description: Friend-to-friend sharing with persistent identities and signed provenance.
publish_to: none
version: 0.2.3+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ournet_core:
    path: ../core
  ournet_transport:
    path: ../transport
  iroh_flutter:
    path: ../vendor/iroh_mobile
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  flutter_secure_storage: 10.0.0
  flutter_webrtc: ^1.6.2+hotfix.1
  iroh_quic: 1.0.3
  flutter_rust_bridge: 2.12.0
  flutter_local_notifications: 22.0.1
  pasteboard: 0.3.0
  app_badge_plus: 1.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.1
  desktop_drop: ^0.8.4
  animations: 2.1.2
  flutter_staggered_grid_view: 0.7.0
  ournet_speech:
    path: plugins/ournet_speech
  record: ^7.1.1
  audioplayers: ^6.8.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  crypto: ^3.0.7
  google_mlkit_text_recognition: ^0.17.1
  ffi: ^2.1.4
  archive: ^4.0.7
  workmanager: ^0.10.10

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: 4.5.4
  msix: 3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/world_land.geojson

# The Windows MSIX package, built by tool/package.ps1 -Msix. The identity is
# Partner Center's Product identity page for the Store listing (9N6P4X13QG9M);
# a test build keeps the name but is signed, and so published, by msix's test
# certificate.
msix_config:
  display_name: OurNet
  publisher_display_name: Chozabu
  identity_name: Chozabu.OurNet
  publisher: CN=30BA6359-7C85-4DB7-96B1-937D4F790B29
  logo_path: ../store/ournet-icon-512.png
  languages: en-gb, en-us
  capabilities: internetClient,internetClientServer,privateNetworkClientServer,microphone,webcam
  build_windows: false
  install_certificate: false
  # Off until chosen in Settings; SystemTray looks it up by this id.
  startup_task:
    task_id: OurNetStartup
    enabled: false
    parameters: --background
  # Matches the guid in services/notifications.dart, so clicking a
  # notification opens OurNet when it is not running.
  toast_activator:
    clsid: c8e1c95a-479c-4b2b-a99e-bb981344aa82
    arguments: --toast
    display_name: OurNet
