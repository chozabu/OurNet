# OurNet plugins: the guest SDK, the packer that turns a crate into an
# installable package, and first-party plugins. Build every package with
#   cargo run -p pack --release
# which writes `dist/<id>.ournet-plugin`. See docs/PLUGINS.md.
[workspace]
resolver = "2"
members = ["sdk", "pack", "echo", "wiki", "microblog", "tictactoe", "pong", "vpn", "git", "git-remote-ournet", "js"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
ournet-plugin = { path = "sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
