[package]
name = "js"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The JavaScript runtime for script plugins: the Boa engine, run once per script plugin with that plugin's grants."

[lib]
crate-type = ["cdylib"]

[dependencies]
ournet-plugin.workspace = true
serde_json.workspace = true
boa_engine = { version = "0.22.0", default-features = false }
boa_gc = "0.22.0"
getrandom = "0.4"
