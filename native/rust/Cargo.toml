[package]
name = "ournet_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native code for OurNet: crypto with the same results as the Dart code it speeds up, and the plugin host."

[lib]
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
# The plugin host (src/plugin.rs): components only, compiled with Cranelift.
wasmtime = { version = "=48.0.6", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "network", "component", "disk"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Shipped and measured builds: the build hook uses this profile when
# CARGO_OURNET_NATIVE_PROFILE=release (set by tool/package.ps1,
# tool/release-android.ps1 and tool/check.ps1 -Performance).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# Everyday builds (dart test, flutter run/test): the same optimisation minus
# cross-crate LTO, so an edit to src/ relinks in seconds instead of redoing
# fat LTO over wasmtime (minutes).
[profile.native-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
