name: Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'transport/**'
      - 'native/**'
      - 'vendor/**'
      - 'tool/setup.sh'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust
      - run: tool/setup.sh
      - name: Vault test
        working-directory: app
        run: flutter test test/vault_test.dart
      - name: Build
        working-directory: app
        run: flutter build linux --release --no-tree-shake-icons "--dart-define=OURNET_BUILD=$(date -u +%Y%m%d-%H%M%S)"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: app/build/linux/x64/release/bundle

  flatpak:
    needs: bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: app/build/linux/x64/release/bundle
      - name: Restore executable bits
        run: chmod +x app/build/linux/x64/release/bundle/ournet
      - name: Shared modules
        run: |
          git clone https://github.com/flathub/shared-modules app/linux/flatpak/shared-modules
          git -C app/linux/flatpak/shared-modules checkout a58e654b9113feffaee113cc7167ebbbdb406bee
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OurNet.flatpak
          manifest-path: app/linux/flatpak/io.github.chozabu.OurNet.yml
          cache-key: flatpak-builder-${{ github.sha }}
